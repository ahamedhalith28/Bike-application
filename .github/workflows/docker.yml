name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/bikeapp-gitci:${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/bikeapp-gitci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: ~/bikeapp
          
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: POSTGRES_PASSWORD,DJANGO_SECRET_KEY,DJANGO_ALLOWED_HOSTS,DOCKER_HUB_USERNAME,IMAGE_TAG
          script: |
            cd ~/bikeapp
            umask 077
            cat > .env <<EOF
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY
            DJANGO_ALLOWED_HOSTS=$DJANGO_ALLOWED_HOSTS
            DOCKER_HUB_USERNAME=$DOCKER_HUB_USERNAME
            IMAGE_TAG=$IMAGE_TAG
            EOF
            docker compose pull web
            docker compose up -d
            docker image prune -f